[ODBC Data Sources]
HPBDB=PostgreSQL

[HPBDB]
; Point Driver at the PostgreSQL ODBC driver on the integration server host.
; Credentials come from: mqsisetdbparms -w <workdir> -n odbc::HPBDB -u hpb -p hpb
Driver=/usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
Servername=localhost
Port=5432
Database=hpb
; PASSTHRU statements use unqualified table names, so default to the core schema
ConnSettings=SET search_path=core
